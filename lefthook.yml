# lefthook.yml - the deterministic quality gates for wm.
#
# Every gate is a command a person can run by hand and get the same answer.
# Nothing here consults a model: a gate that can be wrong for a reason nobody
# can reproduce is not a gate. The LLM review runs through the worker harness,
# not through this file.
#
# lefthook owns .git/hooks. beads runs as one job among the others, through
# 'bd hooks run <hook>'. Do not also run 'bd hooks install': it takes over
# core.hooksPath and these gates stop running. docs/QUALITY.md explains it.
#
# Layers, fastest first:
#   pre-commit  ~5s     paths, docs, test-src, bead-refs, formatting, build, unit, async, beads
#   commit-msg  instant  commit message rules
#   pre-push    ~40s    the above, plus the -pedantic debug build
#   CI                   everything, plus sanitizers and the seam tests
#
# Adding a gate: put the command in a script under scripts/, list it here, and
# add the same command to .github/workflows/quality.yml. docs/QUALITY.md has
# the checklist.

pre-commit:
  parallel: false
  commands:
    beads:
      run: bd hooks run pre-commit

    paths:
      run: ./scripts/check-paths.sh
      fail_text: "A committed file names a home directory. Use a repo-relative path or <placeholder>."

    test-src:
      glob: "tests/unit/test-*.c"
      run: ./scripts/check-test-src.sh
      fail_text: "A test file is missing from TEST_SRC, so its assertions never run."

    bead-refs:
      glob: "*.{c,h,sh,yml,yaml}"
      run: ./scripts/check-bead-refs.sh
      fail_text: "Code cites a beads issue id. Say the reason, constraint or workaround in place."

    docs:
      glob: "*.md"
      run: ./scripts/check-docs.sh
      fail_text: "A document cites a line number, duplicates a count, or claims a completion percentage. Name the symbol or the beads issue; let the command print the number."

    format:
      glob: "*.{c,h}"
      run: ./scripts/format-check.sh {staged_files}
      fail_text: "Formatting: run 'make format' and stage the result."

    build:
      run: make -j$(nproc)
      fail_text: "The tree does not build."

    unit:
      run: make test
      fail_text: "make test failed."

    async:
      run: ./scripts/check-async.sh
      fail_text: "New blocking call in the event loop: nothing in the loop may wait. Move the wait out of the handler, or mark the line with an allow-blocking reason if it runs before the loop starts."

commit-msg:
  commands:
    no-ai-attribution:
      run: ./scripts/check-commit-msg.sh {1}
      fail_text: "The git author is the only attribution a commit gets."

pre-push:
  parallel: false
  commands:
    beads:
      run: bd hooks run pre-push

    paths:
      run: ./scripts/check-paths.sh
      fail_text: "A committed file names a home directory."

    test-src:
      run: ./scripts/check-test-src.sh
      fail_text: "A test file is missing from TEST_SRC."

    bead-refs:
      run: ./scripts/check-bead-refs.sh
      fail_text: "Code cites a beads issue id."

    docs:
      run: ./scripts/check-docs.sh
      fail_text: "A document cites a line number, duplicates a count, or claims a completion percentage."

    format:
      run: ./scripts/format-check.sh
      fail_text: "Formatting: run 'make format'."

    async:
      run: ./scripts/check-async.sh
      fail_text: "New blocking call in the event loop."

    unit:
      run: make test
      fail_text: "make test failed."

    standalone:
      run: make test-standalone && make test-sm-standalone
      fail_text: "A standalone test target failed to link or run."

    sanitize:
      run: ./scripts/check-sanitize.sh
      fail_text: "A new memory leak: fix it, or run --update-baseline and say why it is deferred."

    debug-build:
      # -pedantic is what caught the zero-length array in tiling.c, so it runs on
      # every push. The leading clean stays: this is the only gate that builds
      # the tree from scratch, which is what catches a missing dependency edge.
      # No trailing clean is needed any more; each variant has its own object
      # directory, which build-variants checks.
      run: make clean >/dev/null && make DEBUG=1 >/dev/null && make test >/dev/null && make -j$(nproc)
      fail_text: "The -pedantic debug build or its tests failed."

    build-variants:
      run: ./scripts/check-build-variants.sh
      fail_text: "make, make SANITIZE=1 and make DEBUG=1 no longer share one tree. Each variant needs its own object directory under build/."

    harness-variant:
      run: ./scripts/check-harness-variant.sh
      fail_text: "A harness built a variant other than the one it was asked for, or replaced ./wm while doing it. Build build/<variant>/wm through scripts/lib/wm-variant.sh so a DEBUG=1 run really is a debug WM, says so, and leaves ./wm alone."

post-checkout:
  commands:
    beads:
      run: bd hooks run post-checkout

post-merge:
  commands:
    beads:
      run: bd hooks run post-merge
