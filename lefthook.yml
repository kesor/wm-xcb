# lefthook.yml - the deterministic quality gates for wm.
#
# Every gate is a command a person can run by hand and get the same answer.
# Nothing here consults a model: a gate that can be wrong for a reason nobody
# can reproduce is not a gate. The LLM review runs through the worker harness,
# not through this file.
#
# lefthook owns .git/hooks. beads runs as one job among the others, through
# 'bd hooks run <hook>'. Do not also run 'bd hooks install': it takes over
# core.hooksPath and these gates stop running. docs/QUALITY.md explains it.
#
# Layers, fastest first. The gates in each layer are the blocks below, and
# scripts/gate-list.sh prints them: this header deliberately does not list them,
# because the list it used to carry was missing four of the pre-push gates.
#   pre-commit  every commit
#   commit-msg  every commit
#   pre-push    every push
#   CI          pre-push --force (beads excluded), plus seam and sanitize-x
#
# Adding a gate: put the command in a script under scripts/ and list it here.
# The CI gates job runs this file with --force, so a hook gate needs no
# workflow edit. docs/QUALITY.md has the checklist. The seam and sanitize-x
# jobs in .github/workflows/quality.yml upload logs and run the sanitizer
# rebuild; they are not there because a gate needs a display.

pre-commit:
  parallel: false
  commands:
    beads:
      run: bd hooks run pre-commit

    paths:
      run: ./scripts/check-paths.sh
      fail_text: "A committed file names a home directory. Use a repo-relative path or <placeholder>."

    # CI is this file run from a workflow, so a workflow that does not parse
    # removes every gate at once and says nothing. A worker cannot push to see
    # the run, so the check has to happen here.
    workflow:
      glob: ".github/workflows/*.{yml,yaml}"
      run: ./scripts/check-workflow.sh {staged_files}
      fail_text: "A workflow file does not parse. Run scripts/check-workflow.sh; a broken file here means the next push runs no gates at all."

    test-src:
      glob: "tests/unit/test-*.c"
      run: ./scripts/check-test-src.sh
      fail_text: "A test file is missing from TEST_SRC, so its assertions never run."

    bead-refs:
      glob: "*.{c,h,sh,yml,yaml}"
      run: ./scripts/check-bead-refs.sh
      fail_text: "Code cites a beads issue id. Say the reason, constraint or workaround in place."

    docs:
      glob: "*.md"
      run: ./scripts/check-docs.sh
      fail_text: "A document cites a line number, duplicates a count, or claims a completion percentage. Name the symbol or the beads issue; let the command print the number."

    format:
      glob: "*.{c,h}"
      run: ./scripts/format-check.sh {staged_files}
      fail_text: "Formatting: run 'make format' and stage the result."

    build:
      run: make -j$(nproc)
      fail_text: "The tree does not build."

    unit:
      run: ./scripts/check-unit.sh
      fail_text: "make test failed: the suite's own output is above."

    async:
      run: ./scripts/check-async.sh
      fail_text: "New blocking call in the event loop: nothing in the loop may wait. Move the wait out of the handler, or mark the line with an allow-blocking reason if it runs before the loop starts."

commit-msg:
  commands:
    no-ai-attribution:
      run: ./scripts/check-commit-msg.sh {1}
      fail_text: "The git author is the only attribution a commit gets."

pre-push:
  parallel: false
  commands:
    beads:
      run: bd hooks run pre-push

    # The dev shell is what every other job here runs in, so a broken flake.nix
    # is checked first and costs about a second. It only evaluates the shell; a
    # package that stopped existing or an attribute that moved fails here rather
    # than at the next session's direnv allow.
    flake:
      run: ./scripts/check-flake.sh
      fail_text: "flake.nix does not evaluate. Fix the dev shell: it is what make, every gate and every agent in this tree runs in."

    workflow:
      run: ./scripts/check-workflow.sh
      fail_text: "A workflow file does not parse. A broken file here means the push runs no gates at all."

    paths:
      run: ./scripts/check-paths.sh
      fail_text: "A committed file names a home directory."

    test-src:
      run: ./scripts/check-test-src.sh
      fail_text: "A test file is missing from TEST_SRC."

    bead-refs:
      run: ./scripts/check-bead-refs.sh
      fail_text: "Code cites a beads issue id."

    docs:
      run: ./scripts/check-docs.sh
      fail_text: "A document cites a line number, duplicates a count, or claims a completion percentage."

    format:
      run: ./scripts/format-check.sh
      fail_text: "Formatting: run 'make format'."

    # The gates and the harnesses are shell, so a defect in one of them is a
    # gate that reports the wrong answer. The baseline comparison is not a
    # one-line shellcheck invocation, so this job runs the script.
    shellcheck:
      run: ./scripts/check-shellcheck.sh
      fail_text: "shellcheck reports a finding the baseline does not record. Fix it, or run --update-baseline and say in the commit why it is deferred."

    async:
      run: ./scripts/check-async.sh
      fail_text: "New blocking call in the event loop."

    unit:
      run: ./scripts/check-unit.sh
      fail_text: "make test failed: the suite's own output is above."

    # The only check that looks at the running WM. It used to run only when the
    # author or the reviewer chose to, so a branch that broke mapping, tiling,
    # tags or the EWMH properties merged green. scripts/check-seam.sh starts a
    # private Xvfb for the Xephyr it nests, so a run draws nothing on the desktop
    # it runs on, and it fails rather than skipping when that server cannot
    # start.
    seam:
      run: ./scripts/check-seam.sh
      fail_text: "A new seam failure: something X should see is not there. Run 'make test-x TEST_X_ARGS=--verbose', and baseline a known failure deliberately or fix it."

    # A passing run printed 215 lines: a gcc link line, a format warning and 113
    # assertion lines. The gate prints the summary now, and the log on failure.
    standalone:
      run: ./scripts/check-standalone.sh
      fail_text: "A standalone test target failed to link or run; its output is above."

    sanitize:
      run: ./scripts/check-sanitize.sh
      fail_text: "A new memory leak: fix it, or run --update-baseline and say why it is deferred."

    debug-build:
      # -pedantic is what caught the zero-length array in tiling.c, so it runs on
      # every push. The leading clean stays: this is the only gate that builds
      # the tree from scratch, which is what catches a missing dependency edge.
      # No trailing clean is needed any more; each variant has its own object
      # directory, which build-variants checks.
      # The suite goes through check-unit.sh rather than `make test >/dev/null`:
      # a failing assertion in the debug build is what this gate is for, and the
      # redirect kept make's "Error 1" line and dropped the assertion with it.
      run: ./scripts/check-debug-build.sh
      fail_text: "The -pedantic debug build or its tests failed; its output is above."

    build-variants:
      run: ./scripts/check-build-variants.sh
      fail_text: "make, make SANITIZE=1 and make DEBUG=1 no longer share one tree. Each variant needs its own object directory under build/."

    harness-variant:
      run: ./scripts/check-harness-variant.sh
      fail_text: "A harness built a variant other than the one it was asked for, or replaced ./wm while doing it. Build build/<variant>/wm through scripts/lib/wm-variant.sh so a DEBUG=1 run really is a debug WM, says so, and leaves ./wm alone."

post-checkout:
  commands:
    beads:
      run: bd hooks run post-checkout

post-merge:
  commands:
    beads:
      run: bd hooks run post-merge
