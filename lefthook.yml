# lefthook.yml - the deterministic quality gates for wm.
#
# Every gate is a command a person can run by hand and get the same answer.
# Nothing here consults a model: a gate that can be wrong for a reason nobody
# can reproduce is not a gate. The LLM review runs through the worker harness,
# not through this file.
#
# lefthook owns .git/hooks. beads runs as one job among the others, through
# 'bd hooks run <hook>'. Do not also run 'bd hooks install': it takes over
# core.hooksPath and these gates stop running. docs/QUALITY.md explains it.
#
# Layers, fastest first. The gates in each layer are the blocks below, and
# scripts/gate-list.sh prints them: this header deliberately does not list them,
# because the list it used to carry was missing four of the pre-push gates.
#   pre-commit  every commit
#   commit-msg  every commit
#   pre-push    every push
#   CI          pre-push --force (beads excluded), plus seam and sanitize-x
#
# Adding a gate: put the command in a script under scripts/ and list it here.
# The CI gates job runs this file with --force, so a hook gate needs no
# workflow edit. docs/QUALITY.md has the checklist. The seam and sanitize-x
# jobs in .github/workflows/quality.yml upload logs and run the sanitizer
# rebuild; they are not there because a gate needs a display.

pre-commit:
  parallel: false
  commands:
    beads:
      run: bd hooks run pre-commit

    paths:
      run: ./scripts/check-paths.sh
      fail_text: "A committed file names a home directory. Use a repo-relative path or <placeholder>."

    # The root is an index: build files, documentation entry points and the
    # directories that group the code. A source file there belongs to no group,
    # so a reader has to open the Makefile to learn what it is.
    root:
      run: ./scripts/check-root.sh
      fail_text: "A tracked file sits at the repository root outside the allowlist. Move a source file under src/, or add the new kind of root entry to scripts/lib/root-report.sh in the commit that introduces it."

    # CI is this file run from a workflow, so a workflow that does not parse
    # removes every gate at once and says nothing. A worker cannot push to see
    # the run, so the check has to happen here.
    workflow:
      glob: ".github/workflows/*.{yml,yaml}"
      run: ./scripts/check-workflow.sh {staged_files}
      fail_text: "A workflow file does not parse. Run scripts/check-workflow.sh; a broken file here means the next push runs no gates at all."

    test-src:
      glob: "tests/unit/test-*.c"
      run: ./scripts/check-test-src.sh
      fail_text: "A test file is missing from TEST_SRC, so its assertions never run."

    # The single-writer rule is kept by the compiler, not by a reviewer: a
    # component that assigns a machine-tracked field must not compile. Each
    # fixture under tests/compile-fail/ is built twice, once through the
    # accessor (must succeed) and once assigning the field (must fail), so a
    # refusal is told apart from a broken include path.
    private-state:
      glob: ["*.{c,h}", "tests/compile-fail/*", "scripts/check-private-state.sh"]
      run: ./scripts/check-private-state.sh
      fail_text: "A machine-tracked value is writable from a component again. Move the definition out of the public header and expose an accessor."

    # A .c file that is tracked but missing from SRC compiles nowhere, and
    # check-async scans the build's list, so a blocking call in it is invisible
    # to both. That is how wm-kbd-mouse.c kept an xcb_grab_pointer_reply().
    sources:
      run: ./scripts/check-orphan-sources.sh
      fail_text: "A tracked .c file is in no build target, so the compiler and check-async both skip it. Add it to SRC, or delete it."

    # A stand-in answers every assertion a test asks it, so the program it names
    # is the one part of a test the suite cannot falsify. The gate resolves that
    # name on PATH, requires a file, and looks there for the line the stand-in
    # cites. Instant, and it needs no X server.
    #
    # The glob is a list on purpose: lefthook 2.1.15 reads a single string as one
    # pattern, so `a|b` matches nothing and the gate is skipped every time.
    fakes:
      glob: ["tests/fakes/*", "scripts/check-fakes.sh"]
      run: ./scripts/check-fakes.sh
      fail_text: "A stand-in does not name an installed program and cite a line of it. Its second line says '# models: <program>, <what that program does>', its third says '# from <program>: <a line of the installed file>', the file is named after the program, and the program is on PATH."

    bead-refs:
      glob: "*.{c,h,sh,yml,yaml}"
      run: ./scripts/check-bead-refs.sh
      fail_text: "Code cites a beads issue id. Say the reason, constraint or workaround in place."

    # A description can be erased with a success message: the inline flag writes
    # an empty value, prints "Updated issue" and exits 0. Nothing else in the
    # tree looks at that field, so this does, at the commit that follows the
    # wipe. The tracker is a local database, so a machine without one skips.
    bead-descriptions:
      run: ./scripts/check-bead-descriptions.sh
      fail_text: "A beads issue has no description: one was wiped by an empty --description, or never written. The text before a wipe is in 'bd history <id> --events', and 'bd update <id> --stdin' is the write path that refuses an empty body."

    # The same wipe on the other free-form field a rewrite goes through. There is
    # no stdin form for --acceptance, so nothing in bd refuses an empty value, and
    # bd omits the key when it is empty: only the baseline can tell a wipe from a
    # bead that never had criteria. That second shape is the other baseline's
    # question - a live bead with no criteria is named where it is made, because
    # bd create is not in this tree and cannot be made to refuse the field.
    bead-acceptance:
      run: ./scripts/check-bead-acceptance.sh
      fail_text: "A beads issue lost the acceptance criteria a baseline says it had, or a live issue has none and no baseline records it: an empty --acceptance prints 'Updated issue' and exits 0. The text before a wipe is in 'bd history <id> --events', under Old:; a bead deliberately left without criteria is recorded by scripts/check-bead-acceptance.sh --update-baseline."

    docs:
      glob: "*.md"
      run: ./scripts/check-docs.sh
      fail_text: "A document cites a line number, duplicates a count, or claims a completion percentage. Name the symbol or the beads issue; let the command print the number."

    # A document prints a command so the reader gets the answer without
    # trusting the prose, and nothing ran those commands: docs/TESTING.md
    # pointed rg at the libxcb file that does not hold the macro, so the reader
    # got an exit 1 and an empty screen. No glob: a command in a document goes
    # stale when the code moves, not when the document does.
    doc-commands:
      run: ./scripts/check-doc-commands.sh
      fail_text: "A read-only command a document prints exits non-zero, so the reader gets no answer from it. Point it at the file that holds the symbol, or drop it."

    format:
      glob: "*.{c,h}"
      run: ./scripts/format-check.sh {staged_files}
      fail_text: "Formatting: run 'make format' and stage the result."

    # A commit that touches only documentation cannot break the build or the
    # suite, and both are the two slowest pre-commit gates. The glob is what
    # makes a doc fix cheap without making the gate skippable: `--force` (what
    # the merge and CI use) ignores globs and runs everything.
    build:
      glob: ["*.{c,h}", "Makefile", "*.mk"]
      run: make -j$(nproc)
      fail_text: "The tree does not build."

    unit:
      glob: ["*.{c,h}", "Makefile", "*.mk"]
      run: ./scripts/check-unit.sh
      fail_text: "make test failed: the suite's own output is above."

    # Shifted left: a function that grows past its recorded complexity is a
    # missing test waiting to happen, and the worker who wrote it is the one who
    # can split it. 0.3s, so it runs on every commit.
    complexity:
      glob: "*.{c,h}"
      run: ./scripts/check-complexity.sh {staged_files}
      fail_text: "A function is above its complexity baseline. Split it along a decision that already exists, or run --update-baseline and say why in the commit."

    async:
      run: ./scripts/check-async.sh
      fail_text: "New blocking call in the event loop: nothing in the loop may wait. Move the wait out of the handler, or mark the line with an allow-blocking reason if it runs before the loop starts."

commit-msg:
  commands:
    no-ai-attribution:
      run: ./scripts/check-commit-msg.sh {1}
      fail_text: "The git author is the only attribution a commit gets."

pre-push:
  parallel: false
  commands:
    beads:
      run: bd hooks run pre-push

    # The dev shell is what every other job here runs in, so a broken flake.nix
    # is checked first and costs about a second. It only evaluates the shell; a
    # package that stopped existing or an attribute that moved fails here rather
    # than at the next session's direnv allow.
    flake:
      run: ./scripts/check-flake.sh
      fail_text: "flake.nix does not evaluate. Fix the dev shell: it is what make, every gate and every agent in this tree runs in."

    workflow:
      run: ./scripts/check-workflow.sh
      fail_text: "A workflow file does not parse. A broken file here means the push runs no gates at all."

    paths:
      run: ./scripts/check-paths.sh
      fail_text: "A committed file names a home directory."

    # Same allowlist as the commit hook. CI and the merge run this list, not
    # pre-commit, so a root file committed with the hooks off has to fail here.
    root:
      run: ./scripts/check-root.sh
      fail_text: "A tracked file sits at the repository root outside the allowlist. Move a source file under src/, or add the new kind of root entry to scripts/lib/root-report.sh in the commit that introduces it."

    test-src:
      run: ./scripts/check-test-src.sh
      fail_text: "A test file is missing from TEST_SRC."

    private-state:
      run: ./scripts/check-private-state.sh
      fail_text: "A machine-tracked value is writable from a component again. Move the definition out of the public header and expose an accessor."

    sources:
      run: ./scripts/check-orphan-sources.sh
      fail_text: "A tracked .c file is in no build target, so the compiler and check-async both skip it."

    fakes:
      run: ./scripts/check-fakes.sh
      fail_text: "A stand-in names a program that is not installed, cites a line that program does not have, or is not named after the one it names."

    bead-refs:
      run: ./scripts/check-bead-refs.sh
      fail_text: "Code cites a beads issue id."

    bead-descriptions:
      run: ./scripts/check-bead-descriptions.sh
      fail_text: "A beads issue has no description: one was wiped by an empty --description, or never written."

    bead-acceptance:
      run: ./scripts/check-bead-acceptance.sh
      fail_text: "A beads issue lost the acceptance criteria a baseline says it had, or a live issue has none and no baseline records it: an empty --acceptance prints 'Updated issue' and exits 0."

    docs:
      run: ./scripts/check-docs.sh
      fail_text: "A document cites a line number, duplicates a count, or claims a completion percentage."

    doc-commands:
      run: ./scripts/check-doc-commands.sh
      fail_text: "A read-only command a document prints exits non-zero: the document names a file or a symbol that is not there."

    format:
      run: ./scripts/format-check.sh
      fail_text: "Formatting: run 'make format'."

    # The gates and the harnesses are shell, so a defect in one of them is a
    # gate that reports the wrong answer. The baseline comparison is not a
    # one-line shellcheck invocation, so this job runs the script.
    shellcheck:
      run: ./scripts/check-shellcheck.sh
      fail_text: "shellcheck reports a finding the baseline does not record. Fix it, or run --update-baseline and say in the commit why it is deferred."

    async:
      run: ./scripts/check-async.sh
      fail_text: "New blocking call in the event loop."

    unit:
      run: ./scripts/check-unit.sh
      fail_text: "make test failed: the suite's own output is above."

    # The only check that looks at the running WM. It used to run only when the
    # author or the reviewer chose to, so a branch that broke mapping, tiling,
    # tags or the EWMH properties merged green. scripts/check-seam.sh starts a
    # private Xvfb for the Xephyr it nests, so a run draws nothing on the desktop
    # it runs on, and it fails rather than skipping when that server cannot
    # start.
    seam:
      glob: ["*.{c,h}", "tests/x/**", "scripts/**", "config*.h"]
      run: ./scripts/check-seam.sh
      fail_text: "A new seam failure: something X should see is not there. Run 'make test-x TEST_X_ARGS=--verbose', and baseline a known failure deliberately or fix it."

    # A passing run printed 215 lines: a gcc link line, a format warning and 113
    # assertion lines. The gate prints the summary now, and the log on failure.
    # Complexity runs in pre-commit, over the changed files, and in CI as an
    # advisory step - not here. The number it prints is not reproducible across
    # environments yet (the same function reads 14 here and 38 on a runner), so a
    # pre-push gate would fail a merge for a difference the author cannot see.

    # Shifted left from CI. Both used to run only in the CI workflow, so a worker
    # and a reviewer both saw green on a tree that CI then rejected - which cost
    # a whole cycle twice. Coverage is 7s warm; the fuzzers build once and run
    # 5s each.
    coverage:
      glob: ["*.{c,h}", "tests/quality/**", "scripts/**"]
      run: ./scripts/check-coverage.sh
      fail_text: "Coverage fell below a floor in tests/quality/coverage-baseline.txt, or a file has no floor. Add the floor deliberately, or test what the change added."

    fuzz:
      glob: ["*.{c,h}", "tests/fuzz/**", "scripts/**"]
      run: ./scripts/fuzz.sh 5
      fail_text: "A fuzz harness crashed, or would not build. The crashing input is in build/fuzz/."

    standalone:
      glob: ["*.{c,h}", "Makefile"]
      run: ./scripts/check-standalone.sh
      fail_text: "A standalone test target failed to link or run; its output is above."

    sanitize:
      glob: ["*.{c,h}", "Makefile"]
      run: ./scripts/check-sanitize.sh
      fail_text: "A new memory leak: fix it, or run --update-baseline and say why it is deferred."

    debug-build:
      # -pedantic is what caught the zero-length array in tiling.c, so it runs on
      # every push. The leading clean stays: this is the only gate that builds
      # the tree from scratch, which is what catches a missing dependency edge.
      # No trailing clean is needed any more; each variant has its own object
      # directory, which build-variants checks.
      # The suite goes through check-unit.sh rather than `make test >/dev/null`:
      # a failing assertion in the debug build is what this gate is for, and the
      # redirect kept make's "Error 1" line and dropped the assertion with it.
      run: ./scripts/check-debug-build.sh
      fail_text: "The -pedantic debug build or its tests failed; its output is above."

    build-variants:
      run: ./scripts/check-build-variants.sh
      fail_text: "make, make SANITIZE=1 and make DEBUG=1 no longer share one tree. Each variant needs its own object directory under build/."

    harness-variant:
      run: ./scripts/check-harness-variant.sh
      fail_text: "A harness built a variant other than the one it was asked for, or replaced ./wm while doing it. Build build/<variant>/wm through scripts/lib/wm-variant.sh so a DEBUG=1 run really is a debug WM, says so, and leaves ./wm alone."

post-checkout:
  commands:
    beads:
      run: bd hooks run post-checkout

post-merge:
  commands:
    beads:
      run: bd hooks run post-merge
