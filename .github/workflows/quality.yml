name: quality

# Every gate in docs/QUALITY.md runs here. The gate list lives in lefthook.yml,
# and the gates job runs that list, so a hook gate is not missing from CI. The
# seam suite is in that list and also has its own job, which uploads the logs.
# sanitize-x is the nested-server job that is not a hook: it rebuilds under the
# sanitizers, which pre-push does not.
#
# The seam job is required because tests/x/run.sh now separates known failures
# (tests/quality/seam-baseline.txt) from new ones: a red seam job means this
# branch broke something, which is exactly what a required gate should say.
#
# The sanitize-x job exists because the sanitize gate in the gates job runs the
# unit suite, and without a display the X calls return before they build a
# request. Only a live WM in a nested server can show a memory error in the map
# path.
#
# Neither job wraps its command in xvfb-run. Both harnesses start a private Xvfb
# for the Xephyr they nest, whatever DISPLAY says, so the command CI runs is the
# command a developer runs (scripts/lib/private-display.sh).

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: build, unit tests, formatting, async rule, debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # LEFTHOOK_EXCLUDE=beads: the beads Dolt database is local state and is
      # not in the checkout, so its hook has nothing to run against here.
      #
      # --force: `lefthook run` has no push refs on stdin, so it diffs HEAD
      # against @{push}. actions/checkout does `git checkout -B <branch>
      # refs/remotes/origin/<branch>`, which sets that upstream to the commit
      # just fetched, so the diff is empty and lefthook skips every command and
      # exits 0. --force runs them anyway. The step's runtime is the signal:
      # tens of seconds means the gates ran, a fraction of a second does not.
      - name: quality gates
        run: nix develop --command env LEFTHOOK_EXCLUDE=beads lefthook run pre-push --force --no-auto-install

  seam:
    name: seam tests (what X sees)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: seam tests on a private parent display
        run: nix develop --command env TMPDIR=/tmp make test-x
      - name: seam test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seam-test-logs
          path: /tmp/wm-seam-tests/
          if-no-files-found: error

  coverage:
    name: what the unit suite executes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: line and branch coverage against the baseline
        run: nix develop --command scripts/check-coverage.sh
      - name: coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .cache/coverage/*.gcov.json
          if-no-files-found: warn

  fuzz:
    name: libFuzzer, 60s per harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: fuzz the event dispatcher and the rule matcher
        run: nix develop --command scripts/fuzz.sh 60
      - name: a crash input, if there is one
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash
          path: .cache/fuzz/*crash-*
          if-no-files-found: ignore

  sanitize-x:
    name: the WM in a nested X server under ASan and UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: X harness under ASan and UBSan
        run: nix develop --command scripts/check-sanitize-x.sh
      - name: sanitize report and WM log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitize-x-logs
          path: /tmp/wm-xephyr-test/
          if-no-files-found: error
